services:
  db-localtaskbackend:
    image: postgis/postgis:16-3.4
    container_name: db-localtaskbackend
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: localtask
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: