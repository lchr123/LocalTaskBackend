services:
  db-localtask:
    image: postgis/postgis:16-3.4
    container_name: db-localtask
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - localtask-net

  local-task-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-task-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - localtask-net

volumes:
  postgres_data:

networks:
  localtask-net:
    external: true