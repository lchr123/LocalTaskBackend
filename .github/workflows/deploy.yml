name: Build and Deploy

on:
  push:
    branches: [ develop ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Build Admin Panel
        run: |
          cd admin
          npm install
          npm run build

      - name: Clean up Lightsail
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_IP }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/localtaskbackend
            rm -rf ./dist ./package.json ./docker-compose.yml ./Dockerfile ./nginx.conf ./migrations ./admin/dist

      - name: Copy files to Lightsail
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_IP }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          source: "./dist,./package.json,./docker-compose.yml,./Dockerfile,./nginx.conf,./migrations,./admin/dist"
          target: "/home/ubuntu/localtaskbackend"

      - name: Deploy backend and DB on Lightsail
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_IP }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/localtaskbackend
            echo "${{ secrets.PROD_ENV_FILE }}" > .env
            echo "" >> .env
            echo "ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}" >> .env
            echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
            sudo docker compose down --rmi all --remove-orphans
            sudo docker compose up -d --build
            sudo docker image prune -f

      - name: DB migration
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_IP }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          script: |
            sudo docker exec local-task-backend npm run migrate:up

      - name: Deploy admin panel
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_IP }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/localtaskbackend
            # Copy admin panel to frontend nginx directory
            mkdir -p /home/ubuntu/localtaskapp/admin-dist
            rm -rf /home/ubuntu/localtaskapp/admin-dist/*
            cp -r ./admin/dist/* /home/ubuntu/localtaskapp/admin-dist/
            # Restart nginx to pick up new admin files
            sudo docker restart nginx
